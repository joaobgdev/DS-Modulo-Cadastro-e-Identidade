default:
  image: node:24-alpine
  before_script:
    - apk add --no-cache openssl
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    - cp .env.example .env

stages:
  - test

variables:
  POSTGRES_DB: appstart_test
  POSTGRES_USER: appstart
  POSTGRES_PASSWORD: appstart_ci_password
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://appstart:appstart_ci_password@postgres:5432/appstart_test?schema=public

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

validate-and-test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres

  script:
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run typecheck
    - pnpm db:migrate
    - pnpm run test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'